name: Sync starter

# Keeps starter/ equal to ohhwells-starter on vibe-coded-templates@main, so vibecoders always
# copy the current starter without needing access to the (private) templates repo. Pull-based on
# purpose: nothing in vibe-coded-templates has to know this repo exists.
#
# Needs the TEMPLATES_REPO_TOKEN secret: a token with read access to
# TheFlowOps-Eng/vibe-coded-templates (fine-grained PAT, Contents: read on that one repo).
# The commit back into this repo uses the workflow's own GITHUB_TOKEN.

on:
  schedule:
    - cron: '17 * * * *' # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout vibe-coded-templates@main
        uses: actions/checkout@v4
        with:
          repository: TheFlowOps-Eng/vibe-coded-templates
          ref: main
          token: ${{ secrets.TEMPLATES_REPO_TOKEN }}
          path: .templates

      # Same exclusions 1-SETUP.md used to ask the vibecoder to apply by hand: build output,
      # env files, the deploy manifest (created when publishing), and the starter's older docs,
      # which contradict this repo's. CLAUDE.md imports one of those docs, so that line goes too.
      - name: Replace starter/ with the current ohhwells-starter
        run: |
          set -euo pipefail
          echo "source=$(git -C .templates rev-parse --short HEAD)" >> "$GITHUB_ENV"
          rsync -a --delete \
            --exclude node_modules --exclude .next --exclude tsconfig.tsbuildinfo --exclude .DS_Store \
            --exclude '.env' --exclude '.env*.local' --exclude ohhwells.json \
            --exclude QUICKSTART.md --exclude VIBECODER.md --exclude README.md --exclude OHHWELLS-DEPLOY.md \
            .templates/ohhwells-starter/ starter/
          sed -i '/^@VIBECODER\.md$/d' starter/CLAUDE.md
          rm -rf .templates

      - name: Commit and push if anything changed
        run: |
          set -euo pipefail
          git config user.name "gor017"
          git config user.email "gorkhachatryan017@gmail.com"
          git add -A starter
          if git diff --cached --quiet; then
            echo "starter/ already matches vibe-coded-templates@${source}."
            exit 0
          fi
          git commit -m "Sync starter from vibe-coded-templates@${source}"
          git push
