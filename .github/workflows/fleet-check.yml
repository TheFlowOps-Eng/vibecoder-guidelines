name: Fleet check

# Guard for rule changes: a change to check/ must not turn the template fleet red without anyone
# noticing. Checks out TheFlowOps-Eng/vibe-coded-templates (private) and runs this checker over
# every template, exactly as that repo's own PR gate does.
#
# Needs the TEMPLATES_REPO_TOKEN secret (a token with read access to vibe-coded-templates).
# Secrets are not available to pull requests from forks, and only maintainers can push branches
# here, so the fleet job runs for maintainer changes and is skipped, not failed, otherwise.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check every module
        run: |
          set -euo pipefail
          find check -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Reject fixtures that are not JSON
        run: |
          set -euo pipefail
          for f in check/ai/fixtures/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "$f is not valid JSON"; exit 1; }; done

  fleet:
    runs-on: ubuntu-latest
    env:
      TEMPLATES_TOKEN: ${{ secrets.TEMPLATES_REPO_TOKEN }}
    steps:
      - name: Skipped without TEMPLATES_REPO_TOKEN
        if: env.TEMPLATES_TOKEN == ''
        run: echo "TEMPLATES_REPO_TOKEN is not available (secret missing, or a fork PR) — fleet run skipped."

      - name: Checkout checker
        if: env.TEMPLATES_TOKEN != ''
        uses: actions/checkout@v4
        with:
          path: guidelines

      - name: Checkout vibe-coded-templates
        if: env.TEMPLATES_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: TheFlowOps-Eng/vibe-coded-templates
          ref: main
          token: ${{ env.TEMPLATES_TOKEN }}
          path: templates

      - uses: actions/setup-node@v4
        if: env.TEMPLATES_TOKEN != ''
        with:
          node-version: '22'

      - name: Run the checker over the fleet
        if: env.TEMPLATES_TOKEN != ''
        working-directory: templates
        run: node ../guidelines/check/run.mjs --gha

      - name: Mock AI review over the fleet (no API calls)
        if: env.TEMPLATES_TOKEN != ''
        working-directory: templates
        run: node ../guidelines/check/ai/run-ai-review.mjs --mock
